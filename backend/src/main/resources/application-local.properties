# ================================================
# LOCAL DEVELOPMENT PROFILE (no Supabase / Redis needed)
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=local
# ================================================

# H2 In-Memory Database (replaces Supabase Postgres for local dev)
spring.datasource.url=jdbc:h2:mem:studyloopdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Disable Redis (use a no-op stub so presence tracking doesn't crash)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# JWT: Skip Supabase signature verification in local mode
supabase.jwt.secret=local-dev-secret
supabase.jwt.verify-signature=false

# Show SQL for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
