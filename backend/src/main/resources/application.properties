# =============================================================
# StudyLoop Backend - application.properties
# LOCAL DEVELOPMENT: Uses H2 in-memory DB (no Postgres/Redis needed)
# PRODUCTION: Override these via environment variables
# =============================================================

# Server
server.port=${PORT:8080}

# ── DATABASE (H2 for local, Postgres for prod via env vars) ─────────────────
# H2 in-memory by default. Set DATABASE_URL to a real postgres URL in prod.
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:studyloopdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE,USER,YEAR}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# H2 web console (accessible at http://localhost:8080/h2-console in local dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Auto-detect dialect (H2 locally, Postgres in prod)
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}

# ── REDIS (disabled by default for local dev) ────────────────────────────────
# ChatWebSocketHandler catches Redis errors gracefully so the app runs without it.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
# Disable Redis repositories and cache auto-configuration in local mode
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# ── SUPABASE AUTH ─────────────────────────────────────────────────────────────
# Set to false in local dev → JWT tokens are decoded without signature verification
supabase.jwt.secret=${SUPABASE_JWT_SECRET:local-dev-secret-key-not-used}
supabase.jwt.verify-signature=${SUPABASE_JWT_VERIFY:false}
