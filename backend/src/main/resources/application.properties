# Server Configuration
server.port=${PORT:8080}

# Database Connection (Supabase Postgres / Neon)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Redis Configuration (Upstash Redis for Online Presence Caching)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# Supabase Auth Configuration
# Secret key used to sign Supabase JWTs (optional if verification is disabled for testing)
supabase.jwt.secret=${SUPABASE_JWT_SECRET:}
# Set to false in local development to bypass signature validation if no secret is available
supabase.jwt.verify-signature=${SUPABASE_JWT_VERIFY:false}
